<div class="vz" id="vz" dir="ltr" data-lang="en">

  <header class="vz-head">
    <div class="vz-brand">
      <div class="vz-eyebrow" data-i18n="eyebrow">DM GROUP / FINANCE &amp; COMPLIANCE</div>
      <h2 data-i18n="title">VAT &amp; ZATCA Command Center</h2>
      <p data-i18n="subtitle">Live VAT return figures and e-invoicing compliance across your companies</p>
    </div>
    <div class="vz-lang" role="group" aria-label="Language">
      <button type="button" class="vz-lang-btn is-on" data-act="lang" data-lang="en">English</button>
      <span class="vz-lang-sep" aria-hidden="true">|</span>
      <button type="button" class="vz-lang-btn" data-act="lang" data-lang="ar">العربية</button>
    </div>
  </header>

  <section class="vz-filters" aria-label="Filters">
    <div class="vz-fgroup">
      <label class="vz-field"><span data-i18n="f_company">Company</span>
        <select id="vz-company"><option value="" data-i18n="all_companies">All companies</option></select>
      </label>
      <label class="vz-field"><span data-i18n="f_group">VAT registration group</span>
        <select id="vz-group"><option value="" data-i18n="all_groups">All groups</option></select>
      </label>
    </div>

    <div class="vz-fgroup vz-periods" role="group" aria-label="Period">
      <button type="button" class="vz-chip" data-act="period" data-p="today" data-i18n="p_today">Today</button>
      <button type="button" class="vz-chip" data-act="period" data-p="week" data-i18n="p_week">This Week</button>
      <button type="button" class="vz-chip is-on" data-act="period" data-p="month" data-i18n="p_month">This Month</button>
      <button type="button" class="vz-chip" data-act="period" data-p="lastmonth" data-i18n="p_lastmonth">Last Month</button>
      <button type="button" class="vz-chip" data-act="period" data-p="quarter" data-i18n="p_quarter">This Quarter</button>
      <button type="button" class="vz-chip" data-act="period" data-p="year" data-i18n="p_year">This Year</button>
      <button type="button" class="vz-chip" data-act="period" data-p="custom" data-i18n="p_custom">Custom Period</button>
    </div>

    <div class="vz-fgroup">
      <label class="vz-field"><span data-i18n="f_from">Start date</span><input type="date" id="vz-from"></label>
      <label class="vz-field"><span data-i18n="f_to">End date</span><input type="date" id="vz-to"></label>
    </div>

    <div class="vz-fgroup vz-refresh">
      <button type="button" class="vz-btn vz-btn-primary" id="vz-refresh" data-act="refresh">
        <span class="vz-spin" aria-hidden="true"></span><span data-i18n="refresh">Refresh</span>
      </button>
      <div class="vz-stamp" id="vz-stamp" role="status" aria-live="polite"></div>
    </div>
  </section>

  <div class="vz-scopebar" id="vz-scopebar" role="status"></div>

  <nav class="vz-tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" class="vz-tab is-on" data-act="tab" data-tab="overview" data-i18n="tab_overview">Overview</button>
    <button type="button" role="tab" class="vz-tab" data-act="tab" data-tab="vat" data-i18n="tab_vat">VAT Returns</button>
    <button type="button" role="tab" class="vz-tab" data-act="tab" data-tab="zatca" data-i18n="tab_zatca">ZATCA Status</button>
    <button type="button" role="tab" class="vz-tab" data-act="tab" data-tab="register" data-i18n="tab_register">Invoice Register</button>
    <button type="button" role="tab" class="vz-tab" data-act="tab" data-tab="compliance" data-i18n="tab_compliance">Compliance &amp; Exceptions</button>
  </nav>

  <main class="vz-main">
    <section class="vz-panel" data-panel="overview" id="vz-p-overview"></section>
    <section class="vz-panel" data-panel="vat" id="vz-p-vat" hidden></section>
    <section class="vz-panel" data-panel="zatca" id="vz-p-zatca" hidden></section>
    <section class="vz-panel" data-panel="register" id="vz-p-register" hidden></section>
    <section class="vz-panel" data-panel="compliance" id="vz-p-compliance" hidden></section>
  </main>

  <div class="vz-modal" id="vz-modal" hidden>
    <div class="vz-modal-back" data-act="close-modal"></div>
    <div class="vz-modal-card" role="dialog" aria-modal="true" aria-labelledby="vz-modal-title">
      <div class="vz-modal-head">
        <div>
          <h3 id="vz-modal-title"></h3>
          <div class="vz-modal-sub" id="vz-modal-sub"></div>
        </div>
        <button type="button" class="vz-x" data-act="close-modal" aria-label="Close">&times;</button>
      </div>
      <div class="vz-modal-body" id="vz-modal-body"></div>
    </div>
  </div>

</div>
