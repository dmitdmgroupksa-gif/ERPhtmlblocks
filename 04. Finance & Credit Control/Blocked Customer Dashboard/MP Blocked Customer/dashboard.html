<div class="mp-dashboard-cards">
    <div class="mp-dashboard-card cp-card bc-red">
        <div class="mp-dashboard-title">Blocked Customer Count</div>
        <div class="mp-dashboard-value" id="cp-blocked-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-red" id="mp-blocked-outstanding-card">
        <div class="mp-dashboard-title">Blocked Customer O/S</div>
        <div class="mp-dashboard-value" id="mp-blocked-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card cp-card bc-red">
        <div class="mp-dashboard-title">Blocked Percentage</div>
        <div class="mp-dashboard-value" id="cp-blocked-percent">Loading...</div>
    </div>
    <div class="mp-dashboard-card cp-card bc-blue">
        <div class="mp-dashboard-title">Total Customer Count</div>
        <div class="mp-dashboard-value" id="cp-actual-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card cp-card bc-blue">
        <div class="mp-dashboard-title">Total Customer O/S</div>
        <div class="mp-dashboard-value" id="cp-actual-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card cp-card bc-green">
        <div class="mp-dashboard-title">Running Outstanding</div>
        <div class="mp-dashboard-value" id="mp-running-outstanding">Loading...</div>
    </div>

    <!-- Not shown. The MP JS looks for these IDs, so they must exist. -->
    <div id="mp-blocked-count-card" style="display:none">
        <span id="mp-blocked-count"></span>
    </div>
</div>
