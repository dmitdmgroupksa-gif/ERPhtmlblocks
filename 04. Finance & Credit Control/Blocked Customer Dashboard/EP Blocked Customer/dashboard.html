<div class="mp-dashboard-cards">
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Customer Count</div>
        <div class="mp-dashboard-value" id="ep-blocked-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Customer O/S</div>
        <div class="mp-dashboard-value" id="ep-blocked-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Percentage</div>
        <div class="mp-dashboard-value" id="ep-blocked-percent">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-blue">
        <div class="mp-dashboard-title">Total Customer Count</div>
        <div class="mp-dashboard-value" id="ep-actual-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-blue">
        <div class="mp-dashboard-title">Total Customer O/S</div>
        <div class="mp-dashboard-value" id="ep-actual-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-green">
        <div class="mp-dashboard-title">Running Outstanding</div>
        <div class="mp-dashboard-value" id="ep-running-outstanding">Loading...</div>
    </div>

    <!-- Not shown. The EP JS looks for this ID, so it must exist. -->
    <span id="ep-blocked-customers" style="display:none"></span>
</div>
