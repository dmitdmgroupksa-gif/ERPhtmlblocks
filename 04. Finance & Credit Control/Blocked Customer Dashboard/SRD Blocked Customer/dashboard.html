<div class="mp-dashboard-cards">
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Customer Count</div>
        <div class="mp-dashboard-value" id="srd-blocked-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Customer O/S</div>
        <div class="mp-dashboard-value" id="srd-blocked-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-red">
        <div class="mp-dashboard-title">Blocked Percentage</div>
        <div class="mp-dashboard-value" id="srd-blocked-percent">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-blue">
        <div class="mp-dashboard-title">Total Customer Count</div>
        <div class="mp-dashboard-value" id="srd-actual-count">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-blue">
        <div class="mp-dashboard-title">Total O/S</div>
        <div class="mp-dashboard-value" id="srd-actual-outstanding">Loading...</div>
    </div>
    <div class="mp-dashboard-card bc-green">
        <div class="mp-dashboard-title">Running Outstanding</div>
        <div class="mp-dashboard-value" id="srd-running-outstanding">Loading...</div>
    </div>

    <!-- Not shown. The SRD JS looks for this ID, so it must exist. -->
    <span id="srd-blocked-customers" style="display:none"></span>
</div>
