<div class="dmp" id="dmp" dir="ltr" lang="en">
  <div class="loadbar" id="loadbar"></div>

  <header class="hdr">
    <div class="brand">
      <div class="logo">DM</div>
      <div>
        <h1 data-i18n="Payroll Cost Center Dashboard">Payroll Cost Center Dashboard</h1>
        <p class="sub"><span data-i18n="DM Group KSA">DM Group KSA</span> · <span id="asof"></span></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btnLang" type="button">العربية</button>
      <button class="btn primary" id="btnRefresh" type="button" data-i18n="Refresh">Refresh</button>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <label><span data-i18n="Company">Company</span><select id="fCompany"></select></label>
    <label><span data-i18n="From Date">From Date</span><input type="date" id="fFrom"></label>
    <label><span data-i18n="To Date">To Date</span><input type="date" id="fTo"></label>
    <label><span data-i18n="Cost Center">Cost Center</span><select id="fCC"></select></label>
    <label><span data-i18n="Branch">Branch</span><select id="fBranch"></select></label>
    <label><span data-i18n="Department">Department</span><select id="fDept"></select></label>
    <label class="grow"><span data-i18n="Employee search">Employee search</span><input type="search" id="fQ" data-i18n-ph="Name or ID" placeholder="Name or ID"></label>
    <div class="fbtn">
      <button class="btn primary" id="btnApply" type="button" data-i18n="Apply">Apply</button>
      <button class="btn" id="btnReset" type="button" data-i18n="Reset">Reset</button>
    </div>
  </section>

  <div id="errBox" class="err" role="alert" hidden></div>

  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="overview" data-i18n="Overview">Overview</button>
    <button type="button" role="tab" data-tab="cc" data-i18n="Cost Center Breakdown">Cost Center Breakdown</button>
    <button type="button" role="tab" data-tab="register" data-i18n="Payroll Register">Payroll Register</button>
    <button type="button" role="tab" data-tab="components" data-i18n="Salary Component Analysis">Salary Component Analysis</button>
    <button type="button" role="tab" data-tab="employees" data-i18n="Employees">Employees</button>
    <button type="button" role="tab" data-tab="attendance" data-i18n="Employee Attendance">Employee Attendance</button>
    <button type="button" role="tab" data-tab="leaves" data-i18n="Employee Leaves">Employee Leaves</button>
    <button type="button" role="tab" data-tab="trends" data-i18n="Monthly Trends">Monthly Trends</button>
    <button type="button" role="tab" data-tab="controls" data-i18n="Controls & Audit">Controls &amp; Audit</button>
  </nav>

  <main>
    <section class="pane" id="p-overview" hidden></section>
    <section class="pane" id="p-cc" hidden></section>
    <section class="pane" id="p-register" hidden></section>
    <section class="pane" id="p-components" hidden></section>
    <section class="pane" id="p-employees" hidden></section>
    <section class="pane" id="p-attendance" hidden></section>
    <section class="pane" id="p-leaves" hidden></section>
    <section class="pane" id="p-trends" hidden></section>
    <section class="pane" id="p-controls" hidden></section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="mbox" role="dialog" aria-modal="true">
      <div class="mhead"><h3 id="mTitle"></h3><button type="button" class="x" id="mClose" aria-label="Close">×</button></div>
      <div class="mbody" id="mBody"></div>
    </div>
  </div>
  <div class="tip" id="tip" hidden></div>
</div>
