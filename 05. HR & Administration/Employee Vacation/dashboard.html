<div class="vt">
<div class="wrap">
<div class="sheet">
  <div class="band">
    <div class="band-top">
      <div><h1>Vacation, Air Ticket, Refund &amp; Exit Re-entry Tracker</h1><div class="sub" id="sub"></div></div>
      <div class="period"><div id="period"></div></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
  </div>
  <div class="filters" role="search">
    <label>From <input type="date" id="ffrom"></label>
    <label>To <input type="date" id="fto"></label>
    <label>Company <select id="fc"></select></label>
    <label>Location <select id="fl"></select></label>
    <label>Department <select id="fd"></select></label>
    <label class="grow">Search <input type="search" id="q" placeholder="Employee name or ID"></label>
    <button class="go" id="refresh" type="button">Refresh</button>
    <button class="reset" id="reset" type="button">Reset</button>
  </div>
  <div class="body">
    <section class="view" id="v-overview"></section>
    <section class="view" id="v-followup" hidden></section>
    <section class="view" id="v-timeline" hidden></section>
    <section class="view" id="v-depts" hidden></section>
    <section class="view" id="v-travel" hidden></section>
    <section class="view" id="v-reentry" hidden></section>
  </div>
</div>
</div>
<div class="ov" id="ov" hidden><div class="vmodal" role="dialog" aria-modal="true" aria-labelledby="ovt"><header><h2 id="ovt"></h2><button type="button" id="ovx">Close</button></header><div id="ovb"></div></div></div>
<div class="tip" id="tip" hidden></div>
</div>
