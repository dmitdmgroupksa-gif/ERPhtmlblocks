<div id="ceo-command-center">
  <header class="cc-header">
    <div><div class="cc-eyebrow">DM GROUP / OPERATIONS DESK</div><h2>CEO Command Center</h2><p>Performance, priorities and operational follow-through</p></div>
    <span class="cc-status" role="status">Data connections pending</span>
  </header>
  <nav class="cc-tabs" aria-label="Departments"></nav>
  <section class="cc-filters" aria-label="Dashboard filters">
    <label>Company<select data-filter="company"><option value="">All permitted companies</option></select></label>
    <label>Period<select data-filter="period"><option>Daily</option><option>Weekly</option><option selected>Monthly</option><option>Yearly</option><option value="Custom">Custom date range</option></select></label>
    <label>Reference date<input type="date" data-filter="reference"></label>
    <label data-custom-date hidden>Start date<input type="date" data-filter="from"></label>
    <label data-custom-date hidden>End date<input type="date" data-filter="to"></label>
    <button type="button" class="cc-button cc-primary" data-action="apply">Apply filters</button>
  </section>
  <section class="cc-content" aria-live="polite"></section>
</div>
